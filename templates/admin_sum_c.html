<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="navbar-brand">Welcome to Admin</div>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#adminNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminNavbar">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="/admin_dashboard">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/user_details">Users</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin_search">Search</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin_summary">Summary</a></li>
        <li class="nav-item"><a class="nav-link" href="/login">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="summary-info text-center">
    Summary Charts
  </div>
  <div class="d-flex justify-content-end mb-3 pr-4">
    <a href="/admin/summary/table" class="btn btn-outline-primary">Table View</a>
  </div>
  <div class="container">
    <div class="row">
      <div class="col-md-6 chart-container">
        <div class="chart-title mb-2 font-weight-bold">Revenue from each Parking Lot</div>
        <canvas id="revenueChart"></canvas>
      </div>
      <div class="col-md-6 chart-container">
        <div class="chart-title mb-2 font-weight-bold">Summary on Parking Lots</div>
        <canvas id="occupancyChart"></canvas>
      </div>
    </div>
  </div>
  <script>
    const chartData = {{ chart_data | tojson | safe }};

    const revenueLabels = chartData.map(entry => entry.lot);
    const revenueData = chartData.map(entry => entry.revenue);

    const occupancyLabels = chartData.map(entry => entry.lot);
    const occupiedData = chartData.map(entry => entry.occupied);
    const availableData = chartData.map(entry => entry.available);

    new Chart(document.getElementById('revenueChart').getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: revenueLabels,
        datasets: [{
          label: 'Revenue',
          data: revenueData,
          backgroundColor: ['#66bb6a', '#42a5f5', '#ef5350', '#ffa726', '#ab47bc'],
          borderColor: '#fff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%'
      }
    });

    new Chart(document.getElementById('occupancyChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: occupancyLabels,
        datasets: [
          {
            label: 'Occupied',
            data: occupiedData,
            backgroundColor: '#42a5f5'
          },
          {
            label: 'Available',
            data: availableData,
            backgroundColor: '#66bb6a'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>
</html>
