<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Parking Spot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='book_slot.css') }}">
</head>
<body>
  <form method="POST">
    <div class="form-container">
      <div class="form-header">Book the Parking Spot</div>

      <div class="form-group">
        <label for="spot_id">Parking Spot:</label>
        <input type="text" id="spot_id" name="spot_id" value="{{ spot.id }}" readonly>
      </div>

      <div class="form-group">
        <label for="lot_id">Location Name:</label>
        <input type="text" id="lot_id" name="lot_id" value="{{ lot.prime_location_name }}" readonly>
      </div>

      <div class="form-group">
        <label for="user_id">Price:</label>
        <input type="text" id="user_id" name="user_id" value="{{ lot.price }}" readonly>
      </div>

      <div class="form-group">
        <label for="vehicle_no">Vehicle Number:</label>
        <input type="text" id="vehicle_no" name="vehicle_no" placeholder="Enter vehicle number" required>
      </div>

      <div class="form-buttons">
        <a href="{{ url_for('user_dashboard', user_id=user.id) }}">
          <button type="button">Cancel</button>
        </a>
        <button type="submit">Reserve</button>
      </div>
    </div>
  </form>
</body>
</html>
