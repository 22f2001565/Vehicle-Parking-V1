<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Lot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='edit_lot.css') }}">
</head>
<div class="edit-container">
  <div class="edit-header">Edit Parking Lot</div>
  <form method="POST" action="{{ url_for('edit_lot', lot_id=lot.id) }}">
    <div class="form-group">
      <label for="location">Prime Location Name :</label>
      <input type="text" id="location" name="location" value="{{ lot.prime_location_name }}" />
    </div>
    <div class="form-group">
      <label for="address">Address :</label>
      <input type="text" id="address" name="address" value="{{ lot.address }}" />
    </div>
    <div class="form-group">
      <label for="pincode">Pin code :</label>
      <input type="text" id="pincode" name="pincode" value="{{ lot.pin_code }}" />
    </div>
    <div class="form-group">
      <label for="price">Price (per hour) :</label>
      <input type="number" id="price" name="price" value="{{ lot.price }}" />
    </div>
    <div class="form-group">
      <label for="spots">Maximum spots :</label>
      <input type="number" id="spots" name="spots" value="{{ lot.number_of_spots }}" />
    </div>
    <div class="form-buttons">
      <button type="button" onclick="window.location.href='/admin_dashboard'">Cancel</button>
      <button type="submit">Update</button>
    </div>
  </form>
</div>
</body>
</html>
