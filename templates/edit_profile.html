<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='user.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Welcome, {{ user.full_name }}</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#userNavbar" aria-controls="userNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="userNavbar">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('user_dashboard', user_id=user.id) }}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('user_summary', user_id=user.id) }}">Summary</a></li>
                <li class="nav-item"><a class="nav-link" href="/login">Logout</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('edit_profile', user_id=user.id) }}" id="editProfileLink">Edit Profile</a></li>
            </ul>
        </div>
    </nav>
    <div class="user-dashboard">
        <h2>Edit Profile</h2>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}">
            </div>
            <div class="mb-3">
                <label>Address</label>
                <input type="text" name="address" class="form-control" value="{{ user.address }}">
            </div>
            <div class="mb-3">
                <label>Pincode</label>
                <input type="text" name="pincode" class="form-control" value="{{ user.pincode }}">
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
        </form>
    </div>
</body>
</html>
